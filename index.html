<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>长三角物理研究中心 IOPLY · 3D 数字孪生底座</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #dde5e0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        -webkit-font-smoothing: antialiased;
        user-select: none;
      }

      #scene-root {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        z-index: 1;
        overflow: hidden;
      }

      #scene-root canvas {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
      }

      /* 预留给第二、三阶段 AI 智能安全巡检工作台的独立 HUD 挂载层，禁止穿透干扰 3D 拖拽 */
      #hud-root {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 20;
      }

      /* 本阶段仅保留极简左下角项目标题与鼠标视角提示 */
      .campus-caption {
        position: fixed;
        left: 24px;
        bottom: 22px;
        z-index: 10;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        gap: 4px;
        color: #16291c;
        text-shadow: 0 1px 10px rgba(221, 229, 224, 0.82);
        transition: color 0.45s ease;
      }

      body.mode-dusk {
        background: #1b283a;
      }

      body.mode-night {
        background: #040812;
      }

      body.mode-dusk .campus-caption,
      body.mode-night .campus-caption {
        color: #e5edf7;
        text-shadow: 0 1px 10px rgba(4, 8, 18, 0.72);
      }

      .campus-caption__eyebrow {
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        opacity: 0.56;
      }

      .campus-caption__title {
        font-size: 16px;
        font-weight: 600;
        letter-spacing: 0.04em;
        line-height: 1.25;
      }

      .campus-caption__hint {
        margin-top: 2px;
        font-size: 11px;
        letter-spacing: 0.03em;
        opacity: 0.54;
      }
    </style>
  </head>
  <body>
    <div id="scene-root"></div>
    <div id="hud-root" style="position:fixed;inset:0;pointer-events:none;z-index:20;"></div>

    <div class="campus-caption" aria-label="项目标识与交互提示">
      <div class="campus-caption__eyebrow">IOPLY · LIYANG · KKAA + UAD</div>
      <div class="campus-caption__title">长三角物理研究中心 3D 数字孪生底座</div>
      <div class="campus-caption__hint">左键旋转 · 右键平移 · 滚轮缩放 · 按 N 切换昼夜</div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
